[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-cli"
version = "0.2.0"
description = "Bus for local Codex, Gemini, Claude and Grok harnesses to send messages to each other."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
agents = "agents_cli.cli:main"

[project.urls]
Repository = "https://github.com/pebarone/agents-cli"

[tool.setuptools.packages.find]
include = ["agents_cli*"]
